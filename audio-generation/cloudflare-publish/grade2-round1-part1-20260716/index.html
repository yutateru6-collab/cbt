<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>英検2級 第1回 リスニング Part 1</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6fa;
        color: #182033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f4f6fa;
      }

      main {
        width: min(100% - 28px, 760px);
        margin: 0 auto;
        padding: 28px 0 52px;
      }

      header {
        margin-bottom: 22px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: #526075;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 6vw, 2.25rem);
        line-height: 1.25;
      }

      .intro {
        margin: 10px 0 0;
        color: #526075;
        line-height: 1.7;
      }

      .speed-panel {
        position: sticky;
        z-index: 10;
        top: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 24px;
        padding: 12px;
        border: 1px solid #dbe1ec;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 8px 28px rgba(38, 54, 82, 0.09);
        backdrop-filter: blur(12px);
      }

      .speed-label {
        min-width: 88px;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .speed-buttons {
        display: grid;
        grid-template-columns: repeat(3, minmax(58px, 1fr));
        gap: 7px;
        flex: 1;
      }

      button {
        min-height: 42px;
        border: 1px solid #cbd3e2;
        border-radius: 11px;
        background: #fff;
        color: #26334a;
        font: inherit;
        font-weight: 700;
      }

      button[aria-pressed="true"] {
        border-color: #2458d3;
        background: #2458d3;
        color: #fff;
      }

      section + section {
        margin-top: 30px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 1.02rem;
      }

      .pair {
        color: #657187;
        font-size: 0.88rem;
        font-weight: 600;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      article {
        padding: 15px;
        border: 1px solid #dfe4ed;
        border-radius: 15px;
        background: #fff;
      }

      article h3 {
        margin: 0 0 10px;
        font-size: 1rem;
      }

      audio {
        display: block;
        width: 100%;
        min-height: 44px;
      }

      .status {
        min-height: 1.4em;
        margin: 10px 0 0;
        color: #526075;
        font-size: 0.86rem;
      }

      @media (max-width: 520px) {
        main {
          width: min(100% - 20px, 760px);
          padding-top: 20px;
        }

        .speed-panel {
          align-items: stretch;
          flex-direction: column;
        }

        .speed-label {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Eiken Grade 2 / S-CBT</p>
        <h1>第1回 リスニング Part 1</h1>
        <p class="intro">No.1〜15の試聴ページです。最初は1.0倍で音質を確認し、必要に応じて0.9倍・0.85倍へ切り替えてください。</p>
      </header>

      <div class="speed-panel" aria-label="再生速度設定">
        <div class="speed-label">再生速度 <span id="current-speed">1.0</span>倍</div>
        <div class="speed-buttons">
          <button type="button" data-speed="0.85" aria-pressed="false">0.85倍</button>
          <button type="button" data-speed="0.9" aria-pressed="false">0.9倍</button>
          <button type="button" data-speed="1" aria-pressed="true">1.0倍</button>
        </div>
      </div>

      <div id="questions"></div>
    </main>

    <script>
      const groups = [
        { start: 1, end: 5, pair: "Emma × Cedar" },
        { start: 6, end: 10, pair: "Marin × Ryan" },
        { start: 11, end: 15, pair: "Ava × Cedar" },
      ];

      const version = "20260716-1";
      const container = document.querySelector("#questions");
      let playbackRate = 1;

      const fileName = (number) => `No${String(number).padStart(2, "0")}.wav`;

      groups.forEach((group) => {
        const section = document.createElement("section");
        section.innerHTML = `
          <h2>No.${group.start}〜${group.end} <span class="pair">${group.pair}</span></h2>
          <div class="list"></div>
        `;
        const list = section.querySelector(".list");

        for (let number = group.start; number <= group.end; number += 1) {
          const article = document.createElement("article");
          article.innerHTML = `
            <h3>No.${number}</h3>
            <audio controls preload="metadata" playsinline src="./${fileName(number)}?v=${version}"></audio>
            <p class="status" aria-live="polite"></p>
          `;
          const audio = article.querySelector("audio");
          const status = article.querySelector(".status");
          audio.preservesPitch = true;
          audio.webkitPreservesPitch = true;
          audio.mozPreservesPitch = true;
          audio.playbackRate = playbackRate;
          audio.addEventListener("play", () => {
            document.querySelectorAll("audio").forEach((other) => {
              if (other !== audio) other.pause();
            });
            status.textContent = `${playbackRate}倍で再生中`;
          });
          audio.addEventListener("pause", () => {
            if (!audio.ended) status.textContent = "";
          });
          audio.addEventListener("ended", () => {
            status.textContent = "再生終了";
          });
          audio.addEventListener("error", () => {
            status.textContent = "音声を読み込めませんでした。ページを再読み込みしてください。";
          });
          list.append(article);
        }
        container.append(section);
      });

      document.querySelectorAll("[data-speed]").forEach((button) => {
        button.addEventListener("click", () => {
          playbackRate = Number(button.dataset.speed);
          document.querySelector("#current-speed").textContent = String(playbackRate);
          document.querySelectorAll("[data-speed]").forEach((candidate) => {
            candidate.setAttribute("aria-pressed", String(candidate === button));
          });
          document.querySelectorAll("audio").forEach((audio) => {
            audio.preservesPitch = true;
            audio.webkitPreservesPitch = true;
            audio.mozPreservesPitch = true;
            audio.playbackRate = playbackRate;
            const status = audio.closest("article").querySelector(".status");
            if (!audio.paused) status.textContent = `${playbackRate}倍で再生中`;
          });
        });
      });
    </script>
  </body>
</html>
