name: CBT sale readiness audit
on:
  push:
    branches: ["audit/sale-readiness-20260908"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_BASE_URL: http://127.0.0.1:4173
      QA_TARGET: github-actions-local
      QA_REPOSITORY: yutateru6-collab/cbt
      QA_EXPECTED_SHA: ${{ github.sha }}
      QA_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tests
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Prepare isolated app and source evidence
        run: |
          mkdir -p qa-output
          cp output/pdf/eiken-grade2-final-check-writing-template.pdf qa-output/bonus-source.pdf
          git rev-parse HEAD > qa-output/audit-commit.txt
          echo c69fd06b6217b7ec714f8ed55b041b1a29a63ccd > qa-output/source-commit.txt
          python3 -m http.server 4173 --bind 127.0.0.1 > qa-output/server.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/exam.html >/dev/null; then break; fi
            sleep 1
          done
      - name: Existing interaction regressions
        id: regressions
        continue-on-error: true
        run: npx playwright test --config=qa/playwright.config.cjs qa/progress-review.e2e.spec.cjs qa/review-retry.e2e.spec.cjs qa/grade2-speaking-flow.e2e.spec.cjs
      - name: Paid sets, production audio and visual audit
        id: saleaudit
        continue-on-error: true
        run: npx playwright test --config=qa/sale-audit.config.cjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbt-sale-readiness-evidence
          path: qa-output/
          retention-days: 7
      - name: Gate
        if: always()
        run: |
          test "${{ steps.regressions.outcome }}" = success
          test "${{ steps.saleaudit.outcome }}" = success
