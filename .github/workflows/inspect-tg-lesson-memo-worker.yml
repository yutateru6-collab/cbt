name: Inspect tg-lesson-memo Worker

on:
  push:
    branches:
      - agent/inspect-tg-lesson-memo-worker

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out inspection branch
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          curl -fsSL https://api.cloudflare.com/client/v4/accounts \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Accept: application/json' \
            -o /tmp/accounts.json
          account_id="$(jq -r '.result[0].id // empty' /tmp/accounts.json)"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Download current tg-lesson-memo Worker
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tg-lesson-memo/content/v2" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o tg-lesson-memo-worker-snapshot.bin
          test -s tg-lesson-memo-worker-snapshot.bin
          file tg-lesson-memo-worker-snapshot.bin
          wc -c tg-lesson-memo-worker-snapshot.bin

      - name: Commit Worker source snapshot to inspection branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tg-lesson-memo-worker-snapshot.bin
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged.'
            exit 0
          fi
          git commit -m 'Capture tg-lesson-memo Worker source snapshot'
          git push
