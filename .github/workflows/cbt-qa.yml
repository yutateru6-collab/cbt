name: CBT browser QA

on:
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/cbt-qa.yml"
      - ".github/workflows/cbt-staging.yml"
      - ".github/workflows/cbt-production.yml"
      - ".github/workflows/cbt-production-smoke.yml"
      - "qa/**"
      - "tests/**"
      - "scripts/classify-ci-changes.mjs"
      - "scripts/prepare-worker-assets.mjs"
      - "scripts/detect-listening-audio-change.mjs"
      - "scripts/build-grade2-three-set-corrected-audio.mjs"
      - "scripts/build-set01-duplicate-question-v2-audio.mjs"
      - "scripts/verify-cloudflare-listening-audio.mjs"
      - "scripts/inspect-grade2-three-set-pauses.mjs"
      - "scripts/inspect-set01-intro-gaps.mjs"
      - "scripts/remove-grade2-legacy-listening-explanations.mjs"
      - "audio-generation/**"
      - "assets/**"
      - "audio/**"
      - "output/pdf/**"
      - "tools/listening-player/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "*.jsonc"
      - ".assetsignore"
  workflow_call:
    inputs:
      qa_scope:
        description: Browser QA scope selected by the caller
        required: false
        default: auto
        type: string
  workflow_dispatch:
    inputs:
      qa_scope:
        description: Browser QA scope
        required: true
        default: full
        type: choice
        options:
          - full
          - representative

permissions:
  contents: write
  statuses: write

concurrency:
  group: cbt-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_REPOSITORY: ${{ github.repository }}
      QA_EXPECTED_SHA: ${{ github.sha }}
      QA_RUN_ID: ${{ github.run_id }}
      QA_RUN_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Publish pending browser QA status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(node -e '
            const payload = {
              state: "pending",
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: "CBT browser QA is running",
              context: "cbt-browser-qa",
            };
            process.stdout.write(JSON.stringify(payload));
          ')"
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          REQUESTED_SCOPE: ${{ inputs.qa_scope }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_SCOPE:-auto}"
          case "$requested" in
            full|representative)
              node scripts/classify-ci-changes.mjs --force="$requested"
              exit 0
              ;;
            auto|'') ;;
            *)
              echo "Unsupported QA scope: $requested" >&2
              exit 1
              ;;
          esac

          before="$(node -e '
            const fs = require("node:fs");
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            process.stdout.write(String(event.before || ""));
          ')"

          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            node scripts/classify-ci-changes.mjs --force=full
            exit 0
          fi

          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$before"
          fi

          git diff --name-only "$before" "$GITHUB_SHA" > /tmp/cbt-ci-changed-files.txt
          echo "Changed files:"
          cat /tmp/cbt-ci-changed-files.txt
          node scripts/classify-ci-changes.mjs --files=/tmp/cbt-ci-changed-files.txt

      - name: Validate QA and deployment routing
        shell: bash
        run: |
          set -euo pipefail
          find qa -type f -name '*.cjs' -print0 | xargs -0 -n1 node --check
          node --check scripts/classify-ci-changes.mjs
          node --check scripts/prepare-worker-assets.mjs
          node --check scripts/detect-listening-audio-change.mjs
          node --check grade2-review-retry.js
          node --test tests/ci-change-routing.test.mjs tests/listening-audio-change-detection.test.mjs tests/listening-audio-sync-workflow.test.cjs tests/cloudflare-deploy-contract.test.cjs

      - name: Build exact commit assets for QA
        if: steps.changes.outputs.local_scope != 'none'
        env:
          CBT_BUILD_SHA: ${{ github.sha }}
          CBT_BUILD_REF: ${{ github.ref_name }}
          CBT_DEPLOY_ENV: github-actions-qa
        run: node scripts/prepare-worker-assets.mjs

      - name: Start exact commit QA site
        if: steps.changes.outputs.local_scope != 'none'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-output
          base='http://127.0.0.1:4173'
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory worker-dist > qa-output/local-server.log 2>&1 &
          echo "$!" > qa-output/local-server.pid

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsSL --connect-timeout 2 --max-time 5 "$base/build-info.json?qa=$GITHUB_RUN_ID&attempt=$attempt" -o /tmp/qa-build-info.json; then
              if node -e '
                const fs = require("node:fs");
                const info = JSON.parse(fs.readFileSync("/tmp/qa-build-info.json", "utf8"));
                process.exit(info.commit === process.env.QA_EXPECTED_SHA ? 0 : 1);
              '; then
                ready=1
                break
              fi
            fi
            sleep 1
          done
          test "$ready" = '1'

          cp /tmp/qa-build-info.json qa-output/build-info.json
          echo 'QA_TARGET=github-actions-local' >> "$GITHUB_ENV"
          echo "QA_BASE_URL=$base" >> "$GITHUB_ENV"

          node - <<'NODE'
          const fs = require('node:fs');
          const buildInfo = JSON.parse(fs.readFileSync('/tmp/qa-build-info.json', 'utf8'));
          const output = {
            generatedAt: new Date().toISOString(),
            status: 'ready',
            repository: process.env.QA_REPOSITORY,
            commitSha: process.env.QA_EXPECTED_SHA,
            ref: process.env.GITHUB_REF_NAME,
            target: 'github-actions-local',
            baseUrl: 'http://127.0.0.1:4173',
            workflowRunId: process.env.QA_RUN_ID,
            workflowRunAttempt: process.env.QA_RUN_ATTEMPT,
            observedBuildInfo: buildInfo,
          };
          fs.writeFileSync('qa-output/deployment.json', `${JSON.stringify(output, null, 2)}\n`);
          NODE

      - name: Install required Playwright browsers
        if: steps.changes.outputs.local_scope != 'none' || steps.changes.outputs.run_production_smoke == 'true'
        shell: bash
        env:
          LOCAL_SCOPE: ${{ steps.changes.outputs.local_scope }}
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.62.1
          if [ "$LOCAL_SCOPE" = 'none' ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps chromium webkit
          fi

      - name: Run selected CBT browser QA
        id: browser_qa
        if: steps.changes.outputs.local_scope != 'none'
        shell: bash
        env:
          CI: 'true'
          LOCAL_SCOPE: ${{ steps.changes.outputs.local_scope }}
          LOCAL_SPECS: ${{ steps.changes.outputs.local_specs }}
        run: |
          set -euo pipefail
          case "$LOCAL_SCOPE" in
            full)
              npx playwright test --config=qa/playwright.config.cjs
              ;;
            representative)
              npx playwright test --config=qa/playwright.config.cjs --project=desktop-1440x900 --project=ipad-820x1180 --project=iphone-16-393x852
              ;;
            targeted)
              IFS=',' read -r -a specs <<< "$LOCAL_SPECS"
              test "${#specs[@]}" -gt 0
              npx playwright test --config=qa/playwright.config.cjs "${specs[@]}"
              ;;
            *)
              echo "Unexpected local QA scope: $LOCAL_SCOPE" >&2
              exit 1
              ;;
          esac

      - name: Check edited production smoke test against current production
        if: steps.changes.outputs.run_production_smoke == 'true'
        env:
          CI: 'true'
          QA_BASE_URL: https://cbt.itisnowornever271.workers.dev
          QA_EXPECTED_SHA: ''
        run: npx playwright test --config=qa/production-smoke.config.cjs

      - name: Stop local QA site
        if: always()
        shell: bash
        run: |
          if [ -f qa-output/local-server.pid ]; then
            kill "$(cat qa-output/local-server.pid)" 2>/dev/null || true
          fi

      - name: Build combined QA report
        if: ${{ always() && steps.changes.outputs.run_report == 'true' && steps.browser_qa.outcome != 'skipped' }}
        shell: bash
        env:
          QA_BROWSER_STEP_OUTCOME: ${{ steps.browser_qa.outcome }}
          LOCAL_SCOPE: ${{ steps.changes.outputs.local_scope }}
        run: |
          set -euo pipefail
          if [ "$LOCAL_SCOPE" = 'representative' ]; then
            export QA_EXPECTED_DEVICES='desktop-1440x900,ipad-820x1180,iphone-16-393x852'
          fi
          node qa/merge-report.cjs

      - name: Generate lightweight visual contact sheets
        if: ${{ always() && steps.changes.outputs.run_report == 'true' }}
        run: node qa/make-contact-sheet.cjs

      - name: Save latest QA evidence to qa-latest branch
        if: ${{ always() && steps.changes.outputs.local_scope != 'none' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence='/tmp/cbt-qa-latest'
          rm -rf "$evidence"
          mkdir -p "$evidence"

          for file in latest.json report.json deployment.json build-info.json local-server.log; do
            if [ -f "qa-output/$file" ]; then
              cp "qa-output/$file" "$evidence/$file"
            fi
          done

          if [ -d qa-output/report-parts ]; then
            mkdir -p "$evidence/report-parts"
            cp -a qa-output/report-parts/. "$evidence/report-parts/"
          fi

          if [ -d qa-output/screenshots ]; then
            mkdir -p "$evidence/screenshots"
            cp -a qa-output/screenshots/. "$evidence/screenshots/"
          fi

          if [ -d qa-output/contact-sheets ]; then
            mkdir -p "$evidence/contact-sheets"
            cp -a qa-output/contact-sheets/. "$evidence/contact-sheets/"
          fi

          cat > "$evidence/README.md" <<EOF
          # Latest CBT Browser QA

          This branch is generated automatically by GitHub Actions.

          - Source commit: $GITHUB_SHA
          - Source ref: $GITHUB_REF_NAME
          - Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Generated at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          Only the latest QA evidence is retained on this branch. The branch may be force-updated; main is never force-pushed by this workflow.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan qa-latest-work
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$evidence"/. .
          git add -A
          git commit -m "QA latest for ${GITHUB_SHA:0:12}"
          git push --force origin HEAD:qa-latest

      - name: Publish browser QA commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$QA_JOB_STATUS" = 'success' ]; then
            state='success'
            description='CBT browser QA checks passed'
          else
            case "$QA_JOB_STATUS" in
              cancelled) state='error'; description='CBT browser QA cancelled' ;;
              *) state='failure'; description='CBT browser QA checks failed' ;;
            esac
          fi

          payload="$(QA_STATUS_STATE="$state" QA_STATUS_DESCRIPTION="$description" node -e '
            const payload = {
              state: process.env.QA_STATUS_STATE,
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: process.env.QA_STATUS_DESCRIPTION,
              context: "cbt-browser-qa",
            };
            process.stdout.write(JSON.stringify(payload));
          ')"
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload"
