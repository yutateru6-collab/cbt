name: Apply Drive listening 10 test updates

on:
  push:
    branches:
      - fix-drive-listening-10-20260821

permissions:
  contents: write

jobs:
  update-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-drive-listening-10-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update only routing expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('tests/grade2-listening-audio-fix.test.cjs')
          text = path.read_text()
          text = replace_once(text, 'const SET03_NO11_GAP_FIX_RELEASE = "20260821-set03-no11-travel-guide-gap-fix-v1";\n', '', 'audio test remove No11 release constant')
          text = replace_once(text, 'const SET03_LISTENING_FIX_IDS = new Set([13, 15, 29]);', 'const SET03_LISTENING_FIX_IDS = new Set([11, 13, 15, 29]);', 'audio test Set03 IDs')
          text = replace_once(text, '  if (setKey === "set-03" && id === 11) return SET03_NO11_GAP_FIX_RELEASE;\n', '', 'audio test direct release')
          text = replace_once(text, '  let set03No11GapFixCount = 0;\n', '', 'audio test count declaration')
          text = replace_once(text, '      if (directRelease === SET03_NO11_GAP_FIX_RELEASE) set03No11GapFixCount += 1;\n', '', 'audio test count increment')
          text = replace_once(text, '  assert.equal(set03FixCount, 3);\n  assert.equal(set03No11GapFixCount, 1);', '  assert.equal(set03FixCount, 4);', 'audio test count assertions')
          text = replace_once(text, '  assert.match(examHtml, /grade2-set03-no11-travel-guide-gap-20260821-v1/);', '  assert.match(examHtml, /grade2-drive-listening-10-20260821-v1/);', 'audio test cache version')
          text = replace_once(text, '  console.log("grade2 listening ten-target, Set 03 No.11 gap-fix, No.5-only, and exactly-six V2 routing tests passed");', '  console.log("grade2 listening Drive ZIP ten-target, No.5-only, and exactly-six V2 routing tests passed");', 'audio test message')
          path.write_text(text)

          path = Path('tests/grade2-listening-player.test.cjs')
          text = path.read_text()
          text = replace_once(text, 'const SET03_NO11_GAP_FIX_RELEASE = "20260821-set03-no11-travel-guide-gap-fix-v1";\n', '', 'player test remove No11 release constant')
          text = replace_once(text, 'const SET03_LISTENING_FIX_IDS = new Set([13, 15, 29]);', 'const SET03_LISTENING_FIX_IDS = new Set([11, 13, 15, 29]);', 'player test Set03 IDs')
          text = replace_once(text, '  if (setKey === "set-03" && id === 11) return SET03_NO11_GAP_FIX_RELEASE;\n', '', 'player test direct release')
          text = replace_once(text, '  let set03No11GapFixCount = 0;\n', '', 'player test count declaration')
          text = replace_once(text, '      if (directRelease === SET03_NO11_GAP_FIX_RELEASE) set03No11GapFixCount += 1;\n', '', 'player test count increment')
          text = replace_once(text, '  assert.equal(set03FixCount, 3);\n  assert.equal(set03No11GapFixCount, 1);', '  assert.equal(set03FixCount, 4);', 'player test count assertions')
          text = replace_once(text, '  assert.match(html, /grade2-set03-no11-travel-guide-gap-20260821-v1/);', '  assert.match(html, /grade2-drive-listening-10-20260821-v1/);', 'player test cache version')
          path.write_text(text)
          PY
      - name: Run relevant checks
        run: |
          set -euo pipefail
          node --check grade2-listening-set01-audio-fixes.js
          node tests/grade2-listening-audio-fix.test.cjs
          node --test tests/grade2-listening-player.test.cjs
          node --test tests/grade2-listening-r2-source.test.cjs
          node --test tests/grade2-flow-invariants.test.cjs
          node scripts/prepare-worker-assets.mjs
          npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Commit only related final files and remove this workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-drive-listening-10-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/grade2-listening-audio-fix.test.cjs tests/grade2-listening-player.test.cjs .github/workflows/apply-drive-listening-10-tests.yml
          git commit -m "Align tests with Drive listening 10 routing"
          git push origin HEAD:fix-drive-listening-10-20260821
