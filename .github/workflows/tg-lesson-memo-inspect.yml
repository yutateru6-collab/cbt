name: Inspect tg-lesson-memo Worker

on:
  push:
    branches:
      - agent/tg-lesson-memo-cloudflare-inspect
    paths:
      - .github/workflows/tg-lesson-memo-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPTIONAL_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: tg-lesson-memo

    steps:
      - name: Verify Cloudflare credential is available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Locate Worker and download current source safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tg-worker-inspect
          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          if [ -n "${OPTIONAL_ACCOUNT_ID:-}" ]; then
            printf '%s\n' "$OPTIONAL_ACCOUNT_ID" > /tmp/account-candidates.txt
          else
            curl -fsSL "$api/accounts?per_page=50" -H "$auth" -o /tmp/accounts.json
            node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/accounts.json', 'utf8'));
          if (!data.success || !Array.isArray(data.result) || data.result.length === 0) {
            throw new Error('Cloudflare account list is empty or unavailable');
          }
          fs.writeFileSync('/tmp/account-candidates.txt', data.result.map((x) => x.id).join('\n') + '\n');
          NODE
          fi

          found=''
          while IFS= read -r account_id; do
            [ -n "$account_id" ] || continue
            code="$(curl -sS -o /tmp/settings-candidate.json -w '%{http_code}' \
              "$api/accounts/$account_id/workers/scripts/$WORKER_NAME/settings" \
              -H "$auth")"
            if [ "$code" = '200' ]; then
              found="$account_id"
              cp /tmp/settings-candidate.json /tmp/tg-worker-inspect/settings-raw.json
              break
            fi
          done < /tmp/account-candidates.txt

          if [ -z "$found" ]; then
            echo "Could not locate Worker $WORKER_NAME in accessible accounts" >&2
            exit 1
          fi

          printf '%s\n' "$found" > /tmp/tg-worker-inspect/account-id.txt

          curl -fsSL \
            "$api/accounts/$found/workers/scripts/$WORKER_NAME/content/v2" \
            -H "$auth" \
            -D /tmp/tg-worker-inspect/content-headers.txt \
            -o /tmp/tg-worker-inspect/content-v2.bin

          curl -fsSL \
            "$api/accounts/$found/workers/scripts/$WORKER_NAME" \
            -H "$auth" \
            -D /tmp/tg-worker-inspect/download-headers.txt \
            -o /tmp/tg-worker-inspect/worker-download.bin

          curl -fsSL \
            "$api/accounts/$found/workers/scripts/$WORKER_NAME/deployments" \
            -H "$auth" \
            -o /tmp/tg-worker-inspect/deployments.json

          curl -fsSL \
            "$api/accounts/$found/workers/scripts/$WORKER_NAME/script-settings" \
            -H "$auth" \
            -o /tmp/tg-worker-inspect/script-settings.json || true

          node - <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('/tmp/tg-worker-inspect/settings-raw.json', 'utf8'));
          const settings = source.result || source;
          const allow = [
            'name','type','namespace_id','namespace','database_id','database_name',
            'bucket_name','service','environment','class_name','script_name',
            'queue_name','index_name','id'
          ];
          const bindings = Array.isArray(settings.bindings)
            ? settings.bindings.map((binding) => Object.fromEntries(
                allow.filter((key) => binding[key] !== undefined).map((key) => [key, binding[key]])
              ))
            : [];
          const safe = {
            compatibility_date: settings.compatibility_date || null,
            compatibility_flags: settings.compatibility_flags || [],
            main_module: settings.main_module || null,
            usage_model: settings.usage_model || null,
            placement: settings.placement || null,
            bindings
          };
          fs.writeFileSync('/tmp/tg-worker-inspect/settings-safe.json', JSON.stringify(safe, null, 2));
          console.log(JSON.stringify(safe, null, 2));
          NODE

          rm -f /tmp/tg-worker-inspect/settings-raw.json

      - name: Upload inspection snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tg-lesson-memo-worker-snapshot
          path: /tmp/tg-worker-inspect
          retention-days: 1
          if-no-files-found: error
