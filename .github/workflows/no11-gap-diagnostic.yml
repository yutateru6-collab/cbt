name: Diagnose Set 03 No11 gap

on:
  push:
    branches:
      - diagnostic-set03-no11-gap-20260821
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      EXPECTED_MAIN: a09f021aad19cdb58f70a73fb449fc3c347b5264
      TARGET_RELEASE: 20260821-set03-no11-travel-guide-gap-fix-v1
      TARGET_SHA256: 6e16112bc5b4afa0cf30b694c99a1e19e1d2740dbe4f3372cd865619e8684296
      BASE_URL: https://cbt.itisnowornever271.workers.dev
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify merged main commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
      - name: Verify live production assets match merged main
        run: |
          set -euo pipefail
          for file in exam.html grade2-listening-set01-audio-fixes.js tools/listening-player/index.html; do
            local_sha="$(sha256sum "$file" | awk '{print $1}')"
            matched=0
            for attempt in {1..12}; do
              out="/tmp/live-${file//\//_}"
              if curl -fsSL --connect-timeout 10 --max-time 45 \
                -H 'Cache-Control: no-cache' \
                "$BASE_URL/$file?verify=${EXPECTED_MAIN:0:12}&attempt=$attempt" \
                -o "$out"; then
                live_sha="$(sha256sum "$out" | awk '{print $1}')"
                if [ "$live_sha" = "$local_sha" ]; then
                  echo "$file live SHA matched $live_sha"
                  matched=1
                  break
                fi
                echo "$file not propagated yet local=$local_sha live=$live_sha attempt=$attempt"
              fi
              sleep 2
            done
            test "$matched" = 1
          done
      - name: Verify live routing resolves only the intended No11 release
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 45 \
            -H 'Cache-Control: no-cache' \
            "$BASE_URL/grade2-listening-set01-audio-fixes.js?verify=${EXPECTED_MAIN:0:12}" \
            -o /tmp/live-routing.js
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const sets = ['set-01','set-02','set-03'].map((key) => ({
            key,
            listeningQuestions: Array.from({length: 30}, (_, i) => ({
              id: i + 1,
              part: i < 15 ? 'Part 1' : 'Part 2',
              audioFile: `base-${key}-${i + 1}.wav`,
            })),
          }));
          vm.runInNewContext(fs.readFileSync('/tmp/live-routing.js','utf8'), { window: { scbtGrade2VocabSets: sets }, Set });
          const by = (setKey, id) => sets.find(s => s.key === setKey).listeningQuestions.find(q => q.id === id);
          if (by('set-03',11).audioRelease !== '20260821-set03-no11-travel-guide-gap-fix-v1') process.exit(1);
          for (const id of [13,15,29]) if (by('set-03',id).audioRelease !== '20260821-set03-listening-fixes-v1') process.exit(1);
          for (const [setKey,id] of [['set-01',22],['set-01',25],['set-01',26],['set-01',30],['set-02',25],['set-03',17]]) {
            if (by(setKey,id).audioRelease !== '20260815-grade2-listening-pauses-v2') process.exit(1);
          }
          console.log('live routing verified: No11 new release; other nine approved routes unchanged');
          NODE
      - name: Verify public No11 WAV
        run: |
          set -euo pipefail
          url="https://pub-6e10f4d8b90b42c79b09bec4ee876a01.r2.dev/scbt/grade2/releases/$TARGET_RELEASE/set-03/listening/part1/No11.wav"
          curl -fsSL --connect-timeout 10 --max-time 45 -D /tmp/no11-headers.txt -o /tmp/no11-public.wav "$url"
          test "$(sha256sum /tmp/no11-public.wav | awk '{print $1}')" = "$TARGET_SHA256"
          grep -iEq '^content-type:[[:space:]]*audio/wav' /tmp/no11-headers.txt
          echo "public No11 verified sha256=$TARGET_SHA256 bytes=$(wc -c < /tmp/no11-public.wav)"
