name: Diagnose Set 01 No25 ticket gap

on:
  push:
    branches:
      - diagnostic-set03-no11-gap-20260821

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_MAIN: a09f021aad19cdb58f70a73fb449fc3c347b5264
      SOURCE_RELEASE: 20260815-grade2-listening-pauses-v2
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify current main and routing
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const sets = ['set-01','set-02','set-03'].map((key) => ({
            key,
            listeningQuestions: Array.from({length:30},(_,i)=>({id:i+1,part:i<15?'Part 1':'Part 2',audioFile:`old-${key}-${i+1}.wav`})),
          }));
          vm.runInNewContext(fs.readFileSync('grade2-listening-set01-audio-fixes.js','utf8'), {window:{scbtGrade2VocabSets:sets},Set});
          const q=sets[0].listeningQuestions.find(x=>x.id===25);
          console.log('SET01_NO25_ROUTE', q.audioRelease, q.audioFile);
          if (q.audioRelease !== '20260815-grade2-listening-pauses-v2') process.exit(1);
          NODE
      - name: Print canonical Set 01 No25 text
        run: |
          node - <<'NODE'
          const fs=require('node:fs'); const vm=require('node:vm');
          const context={window:{}}; vm.createContext(context);
          vm.runInContext(fs.readFileSync('grade2-vocab-sets.js','utf8'),context);
          vm.runInContext(fs.readFileSync('grade2-speaking-sets.js','utf8'),context);
          vm.runInContext(fs.readFileSync('grade2-listening-part2-sets.js','utf8'),context);
          const set=context.window.scbtGrade2VocabSets.find(s=>s.key==='set-01');
          const q=set.listeningQuestions.find(q=>Number(q.id)===25);
          if (!q) process.exit(1);
          console.log('SCRIPT',q.script);
          console.log('QUESTION',q.questionText);
          NODE
      - name: Download current production No25 WAV
        run: |
          set -euo pipefail
          key="scbt/grade2/releases/$SOURCE_RELEASE/set-01/listening/part2/No25.wav"
          npx wrangler r2 object get "mimilisten-audio/$key" --file /tmp/No25.wav --remote
          sha256sum /tmp/No25.wav
      - name: Inspect silence near 18 seconds only
        run: |
          python - <<'PY'
          import math, struct, wave, hashlib
          path='/tmp/No25.wav'
          with wave.open(path,'rb') as w:
              sr=w.getframerate(); ch=w.getnchannels(); sw=w.getsampwidth(); n=w.getnframes(); raw=w.readframes(n)
          assert (sr,ch,sw)==(24000,1,2), (sr,ch,sw)
          samples=struct.unpack('<'+'h'*(len(raw)//2),raw)
          print(f'META sr={sr} ch={ch} sw={sw} frames={n} duration={n/sr:.6f}s sha256={hashlib.sha256(open(path,"rb").read()).hexdigest()}')

          # Exact-zero runs of >= 20 ms between 15s and 21s.
          runs=[]; start=None
          for i,x in enumerate(samples):
              if x==0 and start is None: start=i
              elif x!=0 and start is not None:
                  if i-start >= int(0.02*sr): runs.append((start,i,i-start))
                  start=None
          if start is not None and len(samples)-start >= int(0.02*sr): runs.append((start,len(samples),len(samples)-start))
          print('ZERO_RUNS_15_21')
          for s,e,l in runs:
              if e/sr >= 15 and s/sr <= 21:
                  print(f'  frames={s}..{e} len={l} seconds={l/sr:.6f} times={s/sr:.6f}..{e/sr:.6f}')

          # 5 ms RMS windows so quieter non-zero gaps are also visible.
          win=120
          def dbfs(block):
              if not block: return -120.0
              ss=sum(x*x for x in block)/len(block)
              if ss<=0: return -120.0
              return 20*math.log10(math.sqrt(ss)/32768.0)
          rms=[dbfs(samples[i:i+win]) for i in range(0,len(samples),win)]
          for threshold in (-40,-50,-60):
              spans=[]; st=None
              for idx,v in enumerate(rms):
                  t=idx*win/sr
                  if not (15 <= t <= 21.2):
                      if st is not None:
                          en=t
                          if en-st>=0.02: spans.append((st,en,en-st))
                          st=None
                      continue
                  quiet=v<threshold
                  if quiet and st is None: st=t
                  elif not quiet and st is not None:
                      en=t
                      if en-st>=0.02: spans.append((st,en,en-st))
                      st=None
              if st is not None:
                  en=min(21.2,len(samples)/sr)
                  if en-st>=0.02: spans.append((st,en,en-st))
              print('QUIET',threshold)
              for s,e,d in spans: print(f'  {s:.3f}..{e:.3f} len={d:.3f}s')
          PY
