name: Diagnose Set 03 No11 gap

on:
  push:
    branches:
      - diagnostic-set03-no11-gap-20260821
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download current production No11 WAV
        run: |
          set -euo pipefail
          npx wrangler r2 object get \
            'mimilisten-audio/scbt/grade2/releases/20260821-set03-listening-fixes-v1/set-03/listening/part1/No11.wav' \
            --file /tmp/No11.wav \
            --remote
      - name: Pin exact zero run and candidate splice
        run: |
          python - <<'PY'
          import hashlib, struct, wave
          path='/tmp/No11.wav'
          with wave.open(path,'rb') as w:
              params=w.getparams(); sr=w.getframerate(); ch=w.getnchannels(); sw=w.getsampwidth(); n=w.getnframes(); raw=w.readframes(n)
          assert (sr,ch,sw)==(24000,1,2), (sr,ch,sw)
          samples=list(struct.unpack('<'+'h'*(len(raw)//2),raw))
          print(f'META frames={len(samples)} duration={len(samples)/sr:.6f}s sha256={hashlib.sha256(open(path,"rb").read()).hexdigest()}')

          runs=[]; start=None
          for i,x in enumerate(samples):
              if x==0 and start is None:
                  start=i
              elif x!=0 and start is not None:
                  if i-start>=int(0.1*sr): runs.append((start,i,i-start))
                  start=None
          if start is not None and len(samples)-start>=int(0.1*sr): runs.append((start,len(samples),len(samples)-start))
          print('ZERO_RUNS_LAST_8S')
          for s,e,l in runs:
              if e >= len(samples)-8*sr:
                  print(f'  frames {s}..{e} len={l} seconds={l/sr:.6f} times={s/sr:.6f}..{e/sr:.6f}')

          target=[r for r in runs if 30.7 <= r[0]/sr <= 31.0 and 31.5 <= r[1]/sr <= 31.8]
          assert len(target)==1, target
          s,e,l=target[0]
          print(f'TARGET_ZERO_RUN start={s} end={e} frames={l} seconds={l/sr:.6f}')
          print('PRE_SAMPLES', samples[s-24:s])
          print('POST_SAMPLES', samples[e:e+24])

          fixed=samples[:s]+samples[e:]
          out='/tmp/No11-fixed.wav'
          with wave.open(out,'wb') as w:
              w.setparams(params)
              w.writeframes(struct.pack('<'+'h'*len(fixed),*fixed))
          print(f'FIXED frames={len(fixed)} duration={len(fixed)/sr:.6f}s removed={l} sha256={hashlib.sha256(open(out,"rb").read()).hexdigest()}')

          # Strict invariant: output is exactly original prefix + original suffix.
          assert fixed[:s] == samples[:s]
          assert fixed[s:] == samples[e:]
          assert len(samples)-len(fixed) == l
          PY
