name: Verify Google Drive listening 10

on:
  push:
    branches:
      - diagnostic-set03-no11-gap-20260821
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic-set03-no11-gap-20260821
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify all ten Drive ZIP WAVs already exist byte-for-byte in R2
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/spec.tsv <<'EOF'
          20260815-grade2-listening-pauses-v2	set-01/listening/part2/No22.wav	1343486	9d23d0ca16e88e5e0ad08306015f43486d6c76015789c02974ae8ff2d715c24f
          20260815-grade2-listening-pauses-v2	set-01/listening/part2/No25.wav	1468966	2d1fbb0820630d82b4f21792d4675f60df35fbefea13662d37929e1d8ebca4c5
          20260815-grade2-listening-pauses-v2	set-01/listening/part2/No26.wav	1382678	38e58b31a7c04eaaf4b61d74479051c533d532b4981effa0880ab01b8f8679f5
          20260815-grade2-listening-pauses-v2	set-01/listening/part2/No30.wav	1392404	c942f256cc2286c6c6b73b2f14b94f066f8af2717fd54bba68c2bd1fbfbae152
          20260815-grade2-listening-pauses-v2	set-02/listening/part2/No25.wav	1478782	fe9ffef117a644bb4fb12c225eca65af4e9ef61f2286bd3d40fe05dbb02ca73e
          20260821-set03-listening-fixes-v1	set-03/listening/part1/No11.wav	1592000	499b4e54501eccef9362d939297c5cd14c65d7d86de00b317d7e57116d0ac584
          20260821-set03-listening-fixes-v1	set-03/listening/part1/No13.wav	1366494	e064c16271a848e7770a434f9fd3d40d901f771bb162f4de70afba2196ee4b20
          20260821-set03-listening-fixes-v1	set-03/listening/part1/No15.wav	1482478	b083b0d7f61c1fb2d78acfeccd3f643009752e16837e4e4d1d019fa100eb4da3
          20260815-grade2-listening-pauses-v2	set-03/listening/part2/No17.wav	1542472	5ad23b7549f9c00c3f7c8e3efa32027959de1ec19fa064f58a53c7681ac8d722
          20260821-set03-listening-fixes-v1	set-03/listening/part2/No29.wav	1468788	5309e698c917a496ac9ad8b7420853e2c81b3e2291a9e441f24ca7a32edc641c
          EOF

          mkdir -p /tmp/drive10
          for bucket in mimilisten-audio cbt-project-archive; do
            while IFS=$'\t' read -r release relative expected_bytes expected_sha; do
              key="scbt/grade2/releases/$release/$relative"
              safe="${bucket}-${release}-${relative//\//_}"
              out="/tmp/drive10/$safe"
              npx wrangler r2 object get "$bucket/$key" --file "$out" --remote
              actual_bytes="$(wc -c < "$out" | tr -d ' ')"
              actual_sha="$(sha256sum "$out" | awk '{print $1}')"
              test "$actual_bytes" = "$expected_bytes"
              test "$actual_sha" = "$expected_sha"
              python - "$out" <<'PY'
          import sys, wave
          with wave.open(sys.argv[1], 'rb') as w:
              assert w.getframerate() == 24000
              assert w.getnchannels() == 1
              assert w.getsampwidth() == 2
              assert w.getcomptype() == 'NONE'
          PY
              echo "$bucket verified $relative sha256=$actual_sha bytes=$actual_bytes"
            done < /tmp/spec.tsv
          done

          while IFS=$'\t' read -r release relative expected_bytes expected_sha; do
            url="https://pub-6e10f4d8b90b42c79b09bec4ee876a01.r2.dev/scbt/grade2/releases/$release/$relative"
            out="/tmp/drive10/public-${relative//\//_}"
            curl -fsSL --connect-timeout 10 --max-time 60 -D /tmp/headers.txt -o "$out" "$url"
            test "$(wc -c < "$out" | tr -d ' ')" = "$expected_bytes"
            test "$(sha256sum "$out" | awk '{print $1}')" = "$expected_sha"
            grep -iEq '^content-type:[[:space:]]*audio/wav' /tmp/headers.txt
            echo "public verified $relative"
          done < /tmp/spec.tsv
