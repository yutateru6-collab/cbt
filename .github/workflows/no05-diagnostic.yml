name: Diagnose Set 01 No.5 duplicate

on:
  push:
    branches:
      - "agent/fix-set01-no05-duplicate-only"

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Measure actual No.5 transformed WAV
        shell: bash
        run: |
          node --input-type=module <<'NODE' > /tmp/no05-diagnostic.md
          import { fixGrade2ThreeSetOneSecondPausesWav } from "./grade2-listening-three-set-audio-fix.js";

          const url = "https://pub-6e10f4d8b90b42c79b09bec4ee876a01.r2.dev/scbt/grade2/releases/20260815-grade2-listening-pauses-v2/set-01/listening/part1/No05.wav";
          const response = await fetch(`${url}?diagnostic=${Date.now()}`, {
            cache: "no-store",
            headers: { "Cache-Control": "no-cache", Pragma: "no-cache" },
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const source = await response.arrayBuffer();
          const normal = fixGrade2ThreeSetOneSecondPausesWav(source, 5);
          const bytes = Buffer.from(normal.buffer);

          let offset = 12;
          let dataOffset = -1;
          let dataSize = -1;
          while (offset + 8 <= bytes.length) {
            const id = bytes.toString("ascii", offset, offset + 4);
            const size = bytes.readUInt32LE(offset + 4);
            const start = offset + 8;
            if (id === "data") { dataOffset = start; dataSize = size; break; }
            offset = start + size + (size % 2);
          }
          if (dataOffset < 0) throw new Error("WAV data chunk missing");
          const totalFrames = Math.floor(dataSize / 2);
          const isSilent = (frame) => Math.abs(bytes.readInt16LE(dataOffset + frame * 2)) <= 350;
          const hasVoice = (start, end) => {
            for (let frame = Math.max(0, start); frame < Math.min(totalFrames, end); frame += 1) {
              if (!isSilent(frame)) return true;
            }
            return false;
          };
          const findRuns = (minimumSeconds) => {
            const minimumFrames = Math.round(24000 * minimumSeconds);
            const startFrame = Math.max(0, totalFrames - 180000);
            const runs = [];
            let silenceStart = -1;
            for (let frame = startFrame; frame < totalFrames; frame += 1) {
              if (isSilent(frame)) {
                if (silenceStart < 0) silenceStart = frame;
              } else if (silenceStart >= 0) {
                if (frame - silenceStart >= minimumFrames) runs.push([silenceStart, frame]);
                silenceStart = -1;
              }
            }
            if (silenceStart >= 0 && totalFrames - silenceStart >= minimumFrames) runs.push([silenceStart, totalFrames]);
            return runs.map(([start, end]) => ({
              start,
              end,
              frames: end - start,
              startSeconds: Number((start / 24000).toFixed(6)),
              endSeconds: Number((end / 24000).toFixed(6)),
              durationSeconds: Number(((end - start) / 24000).toFixed(6)),
              voiceBefore100ms: hasVoice(start - 2400, start),
              voiceAfter100ms: hasVoice(end, end + 2400),
            }));
          };

          console.log("## Set 01 No.5 actual PCM diagnostic");
          console.log("");
          console.log(`- transformed totalFrames: ${totalFrames}`);
          console.log(`- transformed seconds: ${(totalFrames / 24000).toFixed(6)}`);
          console.log(`- intro target frames: ${normal.targetIntroGapFrames}`);
          console.log(`- body->Question target frames: ${normal.targetBodyQuestionGapFrames}`);
          console.log(`- Question->text target frames: ${normal.targetQuestionGapFrames}`);
          for (const threshold of [0.05, 0.08, 0.1, 0.15, 0.2, 0.25, 0.3]) {
            console.log("");
            console.log(`### Tail silence runs >= ${threshold}s`);
            console.log("```json");
            console.log(JSON.stringify(findRuns(threshold), null, 2));
            console.log("```");
          }
          NODE

      - name: Post diagnostic to PR 21
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/21/comments" --method POST -F body=@/tmp/no05-diagnostic.md
