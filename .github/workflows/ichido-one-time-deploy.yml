name: Deploy ichido one-time

on:
  push:
    paths:
      - ".github/workflows/ichido-one-time-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out ichido
        uses: actions/checkout@v4
        with:
          repository: yutateru6-collab/ichido
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Cloudflare Account ID when configured
        shell: bash
        env:
          OPTIONAL_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${OPTIONAL_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$OPTIONAL_ACCOUNT_ID" >> "$GITHUB_ENV"
          fi

      - name: Validate and build
        run: |
          npm test
          npm run build

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Verify public URL
        shell: bash
        run: |
          set -euo pipefail
          url='https://ichido.itisnowornever271.workers.dev'
          for attempt in {1..15}; do
            if curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$url/?verify=${GITHUB_SHA}&attempt=$attempt" -o /tmp/ichido.html; then
              if grep -q '1° — 見方を少し変える言葉' /tmp/ichido.html; then
                echo "Verified $url"
                exit 0
              fi
            fi
            sleep 2
          done
          echo 'Deployment verification failed.' >&2
          exit 1
