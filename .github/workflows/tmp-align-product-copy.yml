name: Temporary product copy alignment

on:
  push:
    branches:
      - agent/align-pricing-benefit-20260824

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/align-pricing-benefit-20260824
          fetch-depth: 0

      - name: Apply approved product copy changes
        run: node scripts/align-product-pricing-and-benefit.mjs

      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html bonus.html tokusho.html terms.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Align pricing and purchaser bonus copy'
          git push origin HEAD:agent/align-pricing-benefit-20260824
