name: Verify CBT production normal-user

on:
  push:
    branches:
      - "agent/verify-production-**"

permissions:
  contents: read
  statuses: write

concurrency:
  group: cbt-production-live-verifier
  cancel-in-progress: true

jobs:
  production-normal-user-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PROD_SHA: 426422e3e4d55bb28fc869165b9e3bbdf703e950
      QA_EXPECTED_SHA: 426422e3e4d55bb28fc869165b9e3bbdf703e950
      QA_REPOSITORY: YutaTeru/cbt
      QA_TARGET: production-normal
      QA_BASE_URL: https://cbt.itisnowornever271.workers.dev

    steps:
      - name: Check out verification commit
        uses: actions/checkout@v4

      - name: Publish pending live QA status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(node -e '
            const payload = {
              state: "pending",
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: "Live production normal-user QA is running",
              context: "cbt-production-live-qa",
            };
            process.stdout.write(JSON.stringify(payload));
          ')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Wait for exact production commit
        id: build_info
        shell: bash
        run: |
          set -euo pipefail
          base="$QA_BASE_URL"
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsSL --connect-timeout 10 --max-time 45 \
              -H 'Cache-Control: no-cache' \
              "$base/build-info.json?prodverify=$EXPECTED_PROD_SHA&attempt=$attempt" \
              -o /tmp/prod-build-info.json; then
              if node -e '
                const fs = require("node:fs");
                const info = JSON.parse(fs.readFileSync("/tmp/prod-build-info.json", "utf8"));
                process.exit(info.commit === process.env.EXPECTED_PROD_SHA && info.ref === "main" && info.environment === "production" ? 0 : 1);
              '; then
                ready=1
                break
              fi
            fi
            echo "Waiting for production $EXPECTED_PROD_SHA ($attempt/120)..."
            sleep 5
          done
          test "$ready" = '1'
          cat /tmp/prod-build-info.json

      - name: Verify deployed fix files exactly match main
        id: fix_files
        shell: bash
        run: |
          set -euo pipefail
          base="$QA_BASE_URL"
          for file in exam.html grade2-normal-user-fixes.css; do
            curl -fsSL --connect-timeout 10 --max-time 45 \
              -H 'Cache-Control: no-cache' \
              "$base/$file?prodverify=$EXPECTED_PROD_SHA" \
              -o "/tmp/prod-${file}"
            local_sha="$(sha256sum "$file" | awk '{print $1}')"
            prod_sha="$(sha256sum "/tmp/prod-${file}" | awk '{print $1}')"
            echo "$file local=$local_sha production=$prod_sha"
            test "$local_sha" = "$prod_sha"
          done
          grep -q 'body:not(.grade2-developer-mode) .developer-entry-link' /tmp/prod-grade2-normal-user-fixes.css
          grep -q 'listen-review-close' /tmp/prod-grade2-normal-user-fixes.css
          grep -q 'max-width: calc(100vw - 24px)' /tmp/prod-grade2-normal-user-fixes.css

      - name: Install Playwright browsers
        id: browsers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.62.1
          npx playwright install --with-deps chromium webkit

      - name: Run live production normal-user QA
        id: live_qa
        env:
          CI: 'true'
        run: npx playwright test --config=qa/playwright.normal-user.config.cjs

      - name: Publish final live QA status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build_info.outcome }}
          FILE_OUTCOME: ${{ steps.fix_files.outcome }}
          BROWSER_OUTCOME: ${{ steps.browsers.outcome }}
          LIVE_OUTCOME: ${{ steps.live_qa.outcome }}
        run: |
          set -euo pipefail
          if [ "$BUILD_OUTCOME" = success ] && [ "$FILE_OUTCOME" = success ] && [ "$BROWSER_OUTCOME" = success ] && [ "$LIVE_OUTCOME" = success ]; then
            state='success'
            description='Live production normal-user QA passed'
          else
            state='failure'
            description='Live production normal-user QA failed'
          fi
          payload="$(QA_STATUS_STATE="$state" QA_STATUS_DESCRIPTION="$description" node -e '
            const payload = {
              state: process.env.QA_STATUS_STATE,
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: process.env.QA_STATUS_DESCRIPTION,
              context: "cbt-production-live-qa",
            };
            process.stdout.write(JSON.stringify(payload));
          ')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
