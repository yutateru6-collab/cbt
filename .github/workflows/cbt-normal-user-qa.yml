name: CBT normal user QA

on:
  push:
    branches:
      - "agent/qa-normal-user-**"
  workflow_run:
    workflows:
      - "Deploy CBT production"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: cbt-normal-user-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normal-user-qa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_REPOSITORY: ${{ github.repository }}
      QA_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      QA_RUN_ID: ${{ github.run_id }}
      QA_RUN_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_EXPECTED_SHA }}

      - name: Verify exact checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_EXPECTED_SHA"

      - name: Publish pending normal-user QA status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(node -e '
            const payload = {
              state: "pending",
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: "Normal-user CBT QA is running",
              context: "cbt-normal-user-qa",
            };
            process.stdout.write(JSON.stringify(payload));
          ')"
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$QA_EXPECTED_SHA" \
            -d "$payload"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Build exact commit for branch QA
        if: github.event_name == 'push'
        env:
          CBT_BUILD_SHA: ${{ env.QA_EXPECTED_SHA }}
          CBT_BUILD_REF: ${{ github.ref_name }}
          CBT_DEPLOY_ENV: github-actions-normal-user-qa
        run: node scripts/prepare-worker-assets.mjs

      - name: Start local normal-user QA site
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-normal-output
          base='http://127.0.0.1:4174'
          nohup python3 -m http.server 4174 \
            --bind 127.0.0.1 \
            --directory worker-dist \
            > qa-normal-output/local-server.log 2>&1 &
          echo "$!" > qa-normal-output/local-server.pid

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsSL --connect-timeout 2 --max-time 5 \
              "$base/build-info.json?qa=$GITHUB_RUN_ID&attempt=$attempt" \
              -o /tmp/qa-normal-build-info.json; then
              if node -e '
                const fs = require("node:fs");
                const info = JSON.parse(fs.readFileSync("/tmp/qa-normal-build-info.json", "utf8"));
                process.exit(info.commit === process.env.QA_EXPECTED_SHA ? 0 : 1);
              '; then
                ready=1
                break
              fi
            fi
            sleep 1
          done
          test "$ready" = '1'
          cp /tmp/qa-normal-build-info.json qa-normal-output/build-info.json
          echo 'QA_TARGET=local-normal' >> "$GITHUB_ENV"
          echo "QA_BASE_URL=$base" >> "$GITHUB_ENV"

          node - <<'NODE'
          const fs = require('node:fs');
          const output = {
            generatedAt: new Date().toISOString(),
            repository: process.env.QA_REPOSITORY,
            commitSha: process.env.QA_EXPECTED_SHA,
            target: 'local-normal',
            baseUrl: 'http://127.0.0.1:4174',
            workflowRunId: process.env.QA_RUN_ID,
          };
          fs.writeFileSync('qa-normal-output/deployment.json', `${JSON.stringify(output, null, 2)}\n`);
          NODE

      - name: Verify deployed production commit
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-normal-output
          base='https://cbt.itisnowornever271.workers.dev'
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsSL --connect-timeout 10 --max-time 45 \
              -H 'Cache-Control: no-cache' \
              "$base/build-info.json?normalqa=$QA_EXPECTED_SHA&attempt=$attempt" \
              -o /tmp/qa-normal-build-info.json; then
              if node -e '
                const fs = require("node:fs");
                const info = JSON.parse(fs.readFileSync("/tmp/qa-normal-build-info.json", "utf8"));
                process.exit(info.commit === process.env.QA_EXPECTED_SHA && info.environment === "production" ? 0 : 1);
              '; then
                ready=1
                break
              fi
            fi
            echo "Waiting for production commit $QA_EXPECTED_SHA ($attempt/30)..."
            sleep 2
          done
          test "$ready" = '1'
          cp /tmp/qa-normal-build-info.json qa-normal-output/build-info.json
          echo 'QA_TARGET=production-normal' >> "$GITHUB_ENV"
          echo "QA_BASE_URL=$base" >> "$GITHUB_ENV"

          node - <<'NODE'
          const fs = require('node:fs');
          const buildInfo = JSON.parse(fs.readFileSync('/tmp/qa-normal-build-info.json', 'utf8'));
          const output = {
            generatedAt: new Date().toISOString(),
            repository: process.env.QA_REPOSITORY,
            commitSha: process.env.QA_EXPECTED_SHA,
            target: 'production-normal',
            baseUrl: 'https://cbt.itisnowornever271.workers.dev',
            workflowRunId: process.env.QA_RUN_ID,
            observedBuildInfo: buildInfo,
          };
          fs.writeFileSync('qa-normal-output/deployment.json', `${JSON.stringify(output, null, 2)}\n`);
          NODE

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.62.1
          npx playwright install --with-deps chromium webkit

      - name: Run normal-user CBT flow
        id: normal_qa
        env:
          CI: 'true'
        run: npx playwright test --config=qa/playwright.normal-user.config.cjs

      - name: Stop local QA site
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          if [ -f qa-normal-output/local-server.pid ]; then
            kill "$(cat qa-normal-output/local-server.pid)" 2>/dev/null || true
          fi

      - name: Build normal-user QA report
        id: merge_report
        if: always()
        run: node qa/merge-normal-user-report.cjs

      - name: Generate normal-user visual contact sheets
        if: always() && steps.merge_report.outcome == 'success'
        run: node qa/make-normal-user-contact-sheet.cjs

      - name: Upload normal-user QA artifact
        if: always() && steps.merge_report.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cbt-normal-user-qa-${{ env.QA_EXPECTED_SHA }}
          path: qa-normal-output
          if-no-files-found: error
          retention-days: 7

      - name: Save latest normal-user QA evidence
        if: always() && steps.merge_report.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          evidence='/tmp/cbt-qa-normal-latest'
          rm -rf "$evidence"
          mkdir -p "$evidence"

          for file in latest.json report.json deployment.json build-info.json local-server.log; do
            if [ -f "qa-normal-output/$file" ]; then
              cp "qa-normal-output/$file" "$evidence/$file"
            fi
          done
          for directory in report-parts screenshots contact-sheets; do
            if [ -d "qa-normal-output/$directory" ]; then
              mkdir -p "$evidence/$directory"
              cp -a "qa-normal-output/$directory/." "$evidence/$directory/"
            fi
          done

          cat > "$evidence/README.md" <<EOF2
          # Latest CBT Normal-User QA

          This branch contains only the latest normal paid-user flow QA evidence.

          - Source commit: $QA_EXPECTED_SHA
          - Target: $QA_TARGET
          - URL: $QA_BASE_URL/exam.html?plan=three
          - Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Generated at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          The flow never uses dev=1. PC Chromium and iPhone 16-equivalent WebKit exercise Set 01-03 through Speaking, Listening, Reading, Writing, results, and Listening review. On branch pushes the exact commit is built locally; after production deploys the same QA verifies the live production commit.
          EOF2

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan qa-normal-latest-work
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$evidence"/. .
          git add -A
          git commit -m "Normal-user QA latest for ${QA_EXPECTED_SHA:0:12}"
          git push --force origin HEAD:qa-normal-latest

      - name: Publish normal-user QA commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_STEP_OUTCOME: ${{ steps.normal_qa.outcome }}
        run: |
          set -euo pipefail
          if [ "$QA_STEP_OUTCOME" = 'success' ]; then
            state='success'
            description='Normal-user CBT flow passed'
          elif [ "$QA_STEP_OUTCOME" = 'cancelled' ]; then
            state='error'
            description='Normal-user CBT QA cancelled'
          else
            state='failure'
            description='Normal-user CBT flow failed'
          fi
          payload="$(QA_STATUS_STATE="$state" QA_STATUS_DESCRIPTION="$description" node -e '
            const payload = {
              state: process.env.QA_STATUS_STATE,
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: process.env.QA_STATUS_DESCRIPTION,
              context: "cbt-normal-user-qa",
            };
            process.stdout.write(JSON.stringify(payload));
          ')"
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$QA_EXPECTED_SHA" \
            -d "$payload"
