name: Verify tg-lesson-memo student profile deployment v2

on:
  push:
    branches:
      - "agent/tg-lesson-memo-cloudflare-inspect"
    paths:
      - .github/workflows/cbt-staging.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-lesson-memo-student-profile-final
  cancel-in-progress: true

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and syntax-check validated patch
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-patch/student-info.js
          node cloudflare-patch/patch-worker.mjs
          node --check cloudflare-patch/worker-patched.js

      - name: Deploy or verify existing deployment
        shell: bash
        run: |
          set +e
          node cloudflare-patch/deploy-worker.mjs
          code=$?
          printf '%s\n' "$code" > /tmp/deploy-exit-code.txt
          exit 0

      - name: Publish sanitized verification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f cloudflare-deploy-result.json ]; then
            printf '%s\n' '{"worker":"tg-lesson-memo","verified":false,"stage":"workflow","error":"deployment verifier did not produce a result"}' > cloudflare-deploy-result.json
          fi
          git config user.name 'tg-lesson-memo-deployer'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-deploy-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record tg-lesson-memo deployment verification [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Fail workflow if deployment verifier failed
        if: always()
        shell: bash
        run: |
          code="$(cat /tmp/deploy-exit-code.txt 2>/dev/null || printf '1')"
          exit "$code"
