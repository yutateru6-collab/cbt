name: Validate tg-lesson-memo student profile patch

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-lesson-memo-patch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4

      - name: Validate browser client syntax
        run: node --check cloudflare-patch/student-info.js

      - name: Build patched Worker from exact production snapshot
        run: node cloudflare-patch/patch-worker.mjs

      - name: Validate patched Worker syntax and invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-patch/worker-patched.js
          grep -q 'function authenticate' cloudflare-patch/worker-patched.js
          grep -q 'env.ASSETS.fetch' cloudflare-patch/worker-patched.js
          grep -q 'CREATE TABLE IF NOT EXISTS student_profiles' cloudflare-patch/worker-patched.js
          grep -q 'pathname === "/api/student-profiles"' cloudflare-patch/worker-patched.js
          grep -q 'pathname === "/student-info"' cloudflare-patch/worker-patched.js
          grep -q 'assertSameOriginMutation(request)' cloudflare-patch/worker-patched.js
          test "$(wc -c < cloudflare-patch/worker-patched.js)" -gt "$(wc -c < cloudflare-inspect/worker-current.js)"

      - name: Store validated patch on temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tg-lesson-memo-validator'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-patch/worker-patched.js
          if git diff --cached --quiet; then
            echo 'Validated Worker output unchanged.'
            exit 0
          fi
          git commit -m 'Store validated tg-lesson-memo patch [skip ci]'
          git push origin "HEAD:$GITHUB_REF_NAME"
