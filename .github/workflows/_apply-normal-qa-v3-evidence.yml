name: Apply normal QA v3 evidence

on:
  push:
    branches:
      - "agent/qa-normal-user-20260823"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qa-normal-user-20260823
          fetch-depth: 0
      - name: Refine evidence collection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          spec = Path('qa/normal-user-flow.e2e.spec.cjs')
          s = spec.read_text()

          old = """      if (overflow.length < 25 && (rect.right > viewportWidth + 1 || rect.left < -1)) {
                overflow.push({
                  tag: element.tagName.toLowerCase(),
                  id: element.id || '',
                  className: typeof element.className === 'string' ? element.className.slice(0, 160) : '',
                  text: String(element.textContent || '').trim().replace(/\\s+/g, ' ').slice(0, 140),
                  rect: { left: Math.round(rect.left), right: Math.round(rect.right), width: Math.round(rect.width) },
                });
              }"""
          new = """      if (overflow.length < 25 && (rect.right > viewportWidth + 1 || rect.left < -1)) {
                let insideExpectedHorizontalScroller = false;
                for (let ancestor = element.parentElement; ancestor && ancestor !== document.body; ancestor = ancestor.parentElement) {
                  const ancestorStyle = getComputedStyle(ancestor);
                  const scrollableX = ['auto', 'scroll'].includes(ancestorStyle.overflowX) && ancestor.scrollWidth > ancestor.clientWidth + 1;
                  if (scrollableX) {
                    insideExpectedHorizontalScroller = true;
                    break;
                  }
                }
                if (!insideExpectedHorizontalScroller) {
                  overflow.push({
                    tag: element.tagName.toLowerCase(),
                    id: element.id || '',
                    className: typeof element.className === 'string' ? element.className.slice(0, 160) : '',
                    text: String(element.textContent || '').trim().replace(/\\s+/g, ' ').slice(0, 140),
                    rect: { left: Math.round(rect.left), right: Math.round(rect.right), width: Math.round(rect.width) },
                  });
                }
              }"""
          if s.count(old) != 1:
              raise SystemExit(f'overflow filter: expected 1 match, found {s.count(old)}')
          s = s.replace(old, new, 1)

          old = """  await listenReview.click();
            await expect(page.locator('[data-action=\"listen-review-close\"]')).toBeVisible();
            await captureState(page, report, 'listening-review');
            await page.locator('[data-action=\"listen-review-close\"]').click();"""
          new = """  await listenReview.click();
            await captureState(page, report, 'listening-review', { fullPage: true });
            await expect(page.locator('[data-action=\"listen-review-close\"]')).toBeVisible();
            await page.locator('[data-action=\"listen-review-close\"]').click();"""
          if s.count(old) != 1:
              raise SystemExit(f'listening review capture: expected 1 match, found {s.count(old)}')
          s = s.replace(old, new, 1)
          spec.write_text(s)

          workflow = Path('.github/workflows/cbt-normal-user-qa.yml')
          w = workflow.read_text()
          marker = """      - name: Save latest normal-user QA evidence
                if: always() && steps.merge_report.outcome == 'success'
          """
          upload = """      - name: Upload normal-user QA artifact
                if: always() && steps.merge_report.outcome == 'success'
                uses: actions/upload-artifact@v4
                with:
                  name: cbt-normal-user-qa-${{ env.QA_EXPECTED_SHA }}
                  path: qa-normal-output
                  if-no-files-found: error
                  retention-days: 7

          """
          if w.count(marker) != 1:
              raise SystemExit(f'artifact marker: expected 1 match, found {w.count(marker)}')
          w = w.replace(marker, upload + marker, 1)
          workflow.write_text(w)
          PY

          node --check qa/normal-user-flow.e2e.spec.cjs
          rm .github/workflows/_apply-normal-qa-v3-evidence.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/normal-user-flow.e2e.spec.cjs .github/workflows/cbt-normal-user-qa.yml .github/workflows/_apply-normal-qa-v3-evidence.yml
          git diff --cached --check
          git commit -m 'Refine normal-user QA visual evidence'
          git push origin HEAD:agent/qa-normal-user-20260823
