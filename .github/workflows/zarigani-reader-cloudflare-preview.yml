name: Deploy private Zarigani reader preview

on:
  push:
    branches:
      - deploy/zarigani-reader-cloudflare-20260902
    paths:
      - '.github/workflows/zarigani-reader-cloudflare-preview.yml'
      - 'deploy/zarigani-reader-cloudflare/**'

permissions:
  contents: read

concurrency:
  group: zarigani-reader-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Use Cloudflare Account ID when configured
        shell: bash
        env:
          OPTIONAL_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${OPTIONAL_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$OPTIONAL_ACCOUNT_ID" >> "$GITHUB_ENV"
          fi

      - name: Download validated approved reader package
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprnznorth.oaiusercontent.com/files/00000000-1da4-820b-905d-a5c704a6219c/raw?se=2026-09-04T02%3A13%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=702e2d1a-cd37-591a-92b5-becf65ab17ef&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T21%3A05%3A42Z&ske=2026-09-04T21%3A05%3A42Z&sks=b&skv=2026-02-06&sig=SDJmN2Sw3WmgexUyKyxBq46B6lnxIpQO3l6KdcIvoPQ%3D'
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 "$url" -o /tmp/reader-artifact.zip
          echo '7b5fce7e05218198efe9885e3ae0ad652686e6f9ea08010748dba163fa460319  /tmp/reader-artifact.zip' | sha256sum -c -
          rm -rf /tmp/reader-artifact deploy/zarigani-reader-cloudflare/assets
          mkdir -p /tmp/reader-artifact deploy/zarigani-reader-cloudflare/assets
          unzip -q /tmp/reader-artifact.zip -d /tmp/reader-artifact
          test -f /tmp/reader-artifact/zarigani-approved-preview-dist.zip
          unzip -q /tmp/reader-artifact/zarigani-approved-preview-dist.zip -d deploy/zarigani-reader-cloudflare/assets

      - name: Verify publish set contains approved preview only
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/zarigani-reader-cloudflare/assets/app.js
          node --check deploy/zarigani-reader-cloudflare/assets/sw.js
          node --check deploy/zarigani-reader-cloudflare/worker.js
          grep -q 'SameSite=Lax' deploy/zarigani-reader-cloudflare/worker.js
          grep -q '^文学部3年、文学専攻。$' 'deploy/zarigani-reader-cloudflare/assets/manuscript/03-第二部/02-結花、ザリガニ同盟へ.txt'
          grep -q 'いつもの図書館へ向かった' 'deploy/zarigani-reader-cloudflare/assets/manuscript/05-第四部/23-結花の調査記録――論文の海から、一本の糸を.txt'
          grep -q '父と湖や川へ釣りに出かけていた頃の記憶' 'deploy/zarigani-reader-cloudflare/assets/manuscript/05-第四部/22-結花の調査記録――インターネットという巨大な壁.txt'
          ! grep -q '綺麗に整えられたジェルネイルと、' 'deploy/zarigani-reader-cloudflare/assets/manuscript/01-第一部/02-ザリガニ釣り.txt'
          ! grep -R -n -E '[“”"]' deploy/zarigani-reader-cloudflare/assets/manuscript
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'deploy/zarigani-reader-cloudflare/assets';
          const catalog = JSON.parse(fs.readFileSync(path.join(root, 'catalog.json'), 'utf8'));
          if (!Array.isArray(catalog) || catalog.length !== 94) {
            throw new Error(`Expected 94 chapters, got ${catalog.length}`);
          }
          for (const forbidden of ['reference', 'planning', 'history']) {
            if (fs.existsSync(path.join(root, forbidden))) throw new Error(`Forbidden publish directory: ${forbidden}`);
          }
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          const js = fs.readFileSync(path.join(root, 'app.js'), 'utf8');
          for (const marker of ['offlineButton', 'immersiveButton', 'data-weight-choice', 'data-font-choice', 'data-margin-choice', 'data-page-mode-choice']) {
            if (!html.includes(marker)) throw new Error(`Missing reader UI marker: ${marker}`);
          }
          if (!js.includes('zarigani-reader-v2')) throw new Error('Expected reader v2 application bundle.');
          console.log('Validated approved Cloudflare publish set:', catalog.length, 'chapters + PR21/22/23 overlays');
          NODE

      - name: Deploy private reader Worker
        shell: bash
        run: npx --yes wrangler@4 deploy --config deploy/zarigani-reader-cloudflare/wrangler.jsonc

      - name: Generate and install private access token
        id: access
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf '%s' "$token" > /tmp/zarigani-reader-token
          printf '%s' "$token" | npx --yes wrangler@4 secret put READER_ACCESS_TOKEN --config deploy/zarigani-reader-cloudflare/wrangler.jsonc

      - name: Verify private protection and approved reader access
        shell: bash
        run: |
          set -euo pipefail
          base='https://zarigani-reader-preview.itisnowornever271.workers.dev'
          token="$(cat /tmp/zarigani-reader-token)"

          unauth_ok=0
          for attempt in {1..12}; do
            status="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/unauth.html -w '%{http_code}' "$base/?attempt=$attempt" || true)"
            if [ "$status" = '403' ]; then unauth_ok=1; break; fi
            sleep 2
          done
          test "$unauth_ok" = '1'

          auth_ok=0
          for attempt in {1..12}; do
            rm -f /tmp/reader-cookies.txt /tmp/auth-headers.txt
            status="$(curl -sS --connect-timeout 10 --max-time 30 -D /tmp/auth-headers.txt -c /tmp/reader-cookies.txt -o /dev/null -w '%{http_code}' "$base/?key=$token&attempt=$attempt" || true)"
            if [ "$status" = '302' ] && grep -qi 'set-cookie: .*SameSite=Lax' /tmp/auth-headers.txt; then
              if curl -fsSL --connect-timeout 10 --max-time 30 -b /tmp/reader-cookies.txt "$base/catalog.json" -o /tmp/catalog.json \
                && curl -fsSL --connect-timeout 10 --max-time 30 -b /tmp/reader-cookies.txt "$base/index.html" -o /tmp/index.html \
                && curl -fsSL --connect-timeout 10 --max-time 30 -b /tmp/reader-cookies.txt "$base/app.js" -o /tmp/app.js; then
                if node -e "const c=require('/tmp/catalog.json');process.exit(Array.isArray(c)&&c.length===94?0:1)" \
                  && grep -q 'data-weight-choice' /tmp/index.html \
                  && grep -q 'offlineButton' /tmp/index.html \
                  && grep -q 'zarigani-reader-v2' /tmp/app.js; then
                  auth_ok=1
                  break
                fi
              fi
            fi
            sleep 2
          done
          test "$auth_ok" = '1'
          echo 'Cloudflare approved reader verified: unauthorized=403, auth-cookie=SameSite-Lax, authorized chapters=94, reader=v2'

          printf '%s/?key=%s\n' "$base" "$token" > /tmp/zarigani-reader-access.txt

      - name: Store private access link for owner
        uses: actions/upload-artifact@v4
        with:
          name: zarigani-reader-private-access
          path: /tmp/zarigani-reader-access.txt
          if-no-files-found: error
          retention-days: 1
