name: Deploy CBT production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cbt-production.yml"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "purchaser-benefits-worker.js"
      - "purchaser-benefits-access.js"
      - "cloudflare-worker.js"
      - "scripts/prepare-worker-assets.mjs"
      - "index.html"
      - "exam.html"
      - "bonus.html"
      - "privacy.html"
      - "support.html"
      - "terms.html"
      - "tokusho.html"
      - "styles.css"
      - "lp.css"
      - "legal.css"
      - "bonus.css"
      - "app-config-grade2.js"
      - "app.js"
      - "exam-data.js"
      - "grade2-*.js"
      - "grade2-*.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "sw-set02-v2.js"
      - "assets/**"
      - "output/pdf/eiken-grade2-final-check-writing-template.pdf"
      - "tools/listening-player/**"
      - "listening-audio-fix.js"
      - "scripts/build-grade2-three-set-corrected-audio.mjs"
      - "scripts/build-set01-duplicate-question-v2-audio.mjs"
      - "scripts/verify-cloudflare-listening-audio.mjs"
      - "scripts/inspect-grade2-three-set-pauses.mjs"
      - "scripts/inspect-set01-intro-gaps.mjs"
      - "audio-generation/**"
      - "audio/**"
      - "**/*.wav"
      - "**/*.mp3"
      - "**/*.m4a"
      - "**/*.aac"
      - "**/*.ogg"
      - "**/*.flac"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: cbt-production
  cancel-in-progress: true

jobs:
  browser-qa:
    uses: ./.github/workflows/cbt-qa.yml
    with:
      qa_scope: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'auto' }}

  deploy:
    needs: browser-qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use Account ID when configured
        shell: bash
        env:
          OPTIONAL_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${OPTIONAL_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$OPTIONAL_ACCOUNT_ID" >> "$GITHUB_ENV"
          fi

      - name: Detect whether Listening audio sync is required
        id: audio_sync
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/detect-listening-audio-change.mjs --force=workflow-dispatch
            exit 0
          fi

          before="$(node -e '
            const fs = require("node:fs");
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            process.stdout.write(String(event.before || ""));
          ')"

          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            node scripts/detect-listening-audio-change.mjs --force=missing-push-base
            exit 0
          fi

          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$before"
          fi

          git diff --name-only "$before" "$GITHUB_SHA" > /tmp/listening-audio-changed-files.txt
          echo "Changed files:"
          cat /tmp/listening-audio-changed-files.txt
          node scripts/detect-listening-audio-change.mjs --files=/tmp/listening-audio-changed-files.txt

      - name: Validate production deployment contract
        shell: bash
        run: |
          set -euo pipefail
          node --check purchaser-benefits-worker.js
          node --check purchaser-benefits-access.js
          node --check cloudflare-worker.js
          node --check listening-audio-fix.js
          node --check grade2-listening-three-set-audio-fix.js
          node --check grade2-legacy-explanation-cleanup.js
          node --check grade2-canonical-explanations.js
          node --check grade2-explanation-provenance-dev.js
          node --check grade2-premium-bonus.js
          node --check grade2-ai-grading-flow.js
          node --check grade2-result-tabs.js
          node --check grade2-review-retry.js
          node --check grade2-review-resume.js
          node --check tools/listening-player/player.js
          node --check scripts/prepare-worker-assets.mjs
          node --check scripts/remove-grade2-legacy-listening-explanations.mjs
          node --check scripts/verify-cloudflare-listening-audio.mjs
          node --check scripts/verify-grade2-speaking-audio.mjs
          node --check scripts/build-grade2-three-set-corrected-audio.mjs
          node --check scripts/build-set01-duplicate-question-v2-audio.mjs
          node --check scripts/detect-listening-audio-change.mjs
          node scripts/remove-grade2-legacy-listening-explanations.mjs --check
          node tests/grade2-listening-audio-fix.test.cjs
          node tests/grade2-listening-three-set-audio-fix.test.cjs
          node tests/cloudflare-listening-route.test.mjs
          node --test tests/grade2-speaking-content.test.cjs
          if [ -f tests/grade2-listening-player.test.cjs ]; then
            node --test tests/grade2-listening-player.test.cjs
          fi
          if [ -f tests/grade2-listening-r2-source.test.cjs ]; then
            node --test tests/grade2-listening-r2-source.test.cjs
          fi
          node --test tests/listening-audio-change-detection.test.mjs
          node --test tests/listening-audio-sync-workflow.test.cjs
          node --test tests/grade2-premium-ai-grading.test.cjs
          node --test tests/cloudflare-deploy-contract.test.cjs

      - name: Preflight real listening corrections
        if: steps.audio_sync.outputs.required == 'true'
        run: node scripts/verify-cloudflare-listening-audio.mjs --expected-only

      - name: Build precomputed 90-file corrected release
        if: steps.audio_sync.outputs.required == 'true'
        env:
          CBT_BUILD_SHA: ${{ github.sha }}
        run: node scripts/build-grade2-three-set-corrected-audio.mjs --output-dir=/tmp/cbt-three-set-corrected

      - name: Build exactly six Set 01 duplicate-question v2 WAVs
        if: steps.audio_sync.outputs.required == 'true'
        env:
          CBT_BUILD_SHA: ${{ github.sha }}
        run: node scripts/build-set01-duplicate-question-v2-audio.mjs --output-dir=/tmp/cbt-set01-duplicate-v2

      - name: Validate production bundle
        env:
          CBT_BUILD_SHA: ${{ github.sha }}
          CBT_BUILD_REF: ${{ github.ref_name }}
          CBT_DEPLOY_ENV: production
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Upload precomputed 90-file corrected release to production R2
        if: steps.audio_sync.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release='20260817-grade2-sets01-03-listening-pauses-1s-v1'
          for set_num in 01 02 03; do
            set_key="set-$set_num"
            for n in $(seq 1 30); do
              id="$(printf '%02d' "$n")"
              if [ "$n" -le 15 ]; then part='part1'; else part='part2'; fi
              file="/tmp/cbt-three-set-corrected/$set_key/listening/$part/No${id}.wav"
              key="scbt/grade2/releases/$release/$set_key/listening/$part/No${id}.wav"
              test -f "$file"
              npx wrangler r2 object put "mimilisten-audio/$key" \
                --file "$file" \
                --content-type audio/wav \
                --cache-control 'public, max-age=31536000, immutable' \
                --remote
            done
          done

      - name: Upload exactly six Set 01 duplicate-question v2 WAVs to production R2
        if: steps.audio_sync.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release='20260817-set01-listening-duplicate-question-fix-v2'
          for n in 06 07 08 10 12 14; do
            file="/tmp/cbt-set01-duplicate-v2/set-01/listening/part1/No${n}.wav"
            key="scbt/grade2/releases/$release/set-01/listening/part1/No${n}.wav"
            test -f "$file"
            npx wrangler r2 object put "mimilisten-audio/$key" \
              --file "$file" \
              --content-type audio/wav \
              --cache-control 'public, max-age=31536000, immutable' \
              --remote
          done

      - name: Deploy Worker cbt
        env:
          CBT_BUILD_SHA: ${{ github.sha }}
          CBT_BUILD_REF: ${{ github.ref_name }}
          CBT_DEPLOY_ENV: production
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify production deployment
        shell: bash
        env:
          CBT_BUILD_SHA: ${{ github.sha }}
          CBT_BUILD_REF: ${{ github.ref_name }}
          CBT_DEPLOY_ENV: production
        run: |
          set -euo pipefail
          base='https://cbt.itisnowornever271.workers.dev'
          stamp="${GITHUB_SHA:0:12}"

          build_ready=0
          for attempt in {1..12}; do
            if curl -fsSL --connect-timeout 10 --max-time 45 \
              -H 'Cache-Control: no-cache' \
              "$base/build-info.json?verify=$stamp&attempt=$attempt" \
              -o /tmp/build-info.json; then
              if node -e '
                const fs = require("node:fs");
                const info = JSON.parse(fs.readFileSync("/tmp/build-info.json", "utf8"));
                process.exit(info.commit === process.env.CBT_BUILD_SHA && info.ref === process.env.CBT_BUILD_REF && info.environment === process.env.CBT_DEPLOY_ENV ? 0 : 1);
              '; then
                build_ready=1
                break
              fi
            fi
            echo "Waiting for production build metadata propagation ($attempt/12)..."
            sleep 2
          done
          test "$build_ready" = '1'

          node - <<'NODE'
          const fs = require("node:fs");
          const info = JSON.parse(fs.readFileSync("/tmp/build-info.json", "utf8"));
          console.log("build-info verified", info);
          NODE

          verify_asset() {
            file="$1"
            local_path="worker-dist/$file"
            test -f "$local_path"
            local_sha="$(sha256sum "$local_path" | awk '{print $1}')"
            matched=0
            for attempt in {1..12}; do
              if [ "$file" = "exam.html" ]; then
                verify_url="$base/$file?plan=sample&verify=$stamp&attempt=$attempt"
              else
                verify_url="$base/$file?verify=$stamp&attempt=$attempt"
              fi
              if curl -fsSL --connect-timeout 10 --max-time 45 \
                -H 'Cache-Control: no-cache' \
                "$verify_url" \
                -o "/tmp/prod-${file//\//_}"; then
                prod_sha="$(sha256sum "/tmp/prod-${file//\//_}" | awk '{print $1}')"
                if [ "$local_sha" = "$prod_sha" ]; then
                  matched=1
                  break
                fi
              fi
              echo "Waiting for $file propagation ($attempt/12)..."
              sleep 2
            done
            test "$matched" = '1'
          }

          for file in \
            index.html \
            manifest.webmanifest \
            sw.js \
            app-config-grade2.js \
            bonus.css \
            grade2-premium-bonus.js \
            grade2-ai-grading-flow.js \
            grade2-ai-grading-flow.css \
            grade2-result-tabs.js \
            grade2-result-tabs.css \
            grade2-normal-user-fixes.css \
            grade2-review-retry.js \
            grade2-review-retry.css \
            grade2-review-resume.js \
            exam.html \
            support.html \
            app.js \
            grade2-listening-part2-sets.js \
            grade2-listening-set01-audio-fixes.js \
            grade2-legacy-explanation-cleanup.js \
            grade2-set-01-explanations.js \
            grade2-skill-explanations.js \
            grade2-explanation-sync.js \
            grade2-canonical-explanations.js \
            grade2-explanation-provenance-dev.js; do
            verify_asset "$file"
          done

          grep -q '販売準備中' /tmp/prod-index.html
          if grep -Eq 'exam\.html\?plan=(single|three)|developer-entry-link' /tmp/prod-index.html; then
            echo 'Public LP unexpectedly exposes a paid or developer exam entry.' >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("/tmp/prod-manifest.webmanifest", "utf8"));
          if (manifest.start_url !== "/exam.html?plan=sample&demo=1&fresh=1") {
            throw new Error(`Unexpected production start_url: ${manifest.start_url}`);
          }
          NODE

          for plan in single three; do
            headers="/tmp/prod-exam-${plan}-headers.txt"
            status="$(curl -sS --connect-timeout 10 --max-time 45 \
              -H 'Cache-Control: no-cache' \
              -D "$headers" \
              -o /dev/null \
              -w '%{http_code}' \
              "$base/exam.html?plan=$plan&verify=$stamp")"
            test "$status" = '303'
            node - "$headers" "$base/#pricing" <<'NODE'
          const fs = require("node:fs");
          const [headersPath, expected] = process.argv.slice(2);
          const headers = fs.readFileSync(headersPath, "utf8");
          const match = /^location:\s*(.+)$/im.exec(headers);
          if (!match) throw new Error("Missing paid exam redirect Location header.");
          const actual = new URL(match[1].trim(), expected).href;
          if (actual !== expected) throw new Error(`Unexpected paid exam redirect: ${actual}`);
          NODE
          done

          bonus_status="$(curl -sS --connect-timeout 10 --max-time 45 \
            -H 'Cache-Control: no-cache' \
            -o /tmp/prod-bonus-locked.html \
            -w '%{http_code}' \
            "$base/bonus.html?purchase=three&verify=$stamp")"
          test "$bonus_status" = '403'
          grep -q '購入後のご案内から開いてください' /tmp/prod-bonus-locked.html

          pdf_status="$(curl -sS --connect-timeout 10 --max-time 45 \
            -H 'Cache-Control: no-cache' \
            -o /dev/null \
            -w '%{http_code}' \
            "$base/output/pdf/eiken-grade2-final-check-writing-template.pdf?verify=$stamp")"
          test "$pdf_status" = '303'

          if [ -f worker-dist/tools/listening-player/index.html ]; then
            for file in \
              tools/listening-player/index.html \
              tools/listening-player/player.js \
              tools/listening-player/player.css; do
              verify_asset "$file"
            done
          fi

          node scripts/verify-cloudflare-listening-audio.mjs "$base"
          node scripts/verify-grade2-speaking-audio.mjs "$base"
          echo "PRODUCTION_URL=$base/"
